<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      width: 320px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(120% 100% at 0% 0%, rgba(191, 163, 93, 0.12) 0%, rgba(191, 163, 93, 0) 45%),
        #0f0f10;
      color: #efe6d2;
    }

    .popup {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 2px 0;
    }

    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      box-shadow: 0 0 0 1px rgba(239, 230, 210, 0.12);
    }

    .title-wrap {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #f6edd8;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 11px;
      color: #bba98d;
      line-height: 1.1;
    }

    .modes {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mode-btn {
      width: 100%;
      border: 1px solid #2f2f33;
      background: linear-gradient(180deg, #1a1a1d 0%, #151518 100%);
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      padding: 10px 11px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }

    .mode-btn:hover {
      border-color: #4b4438;
      background: linear-gradient(180deg, #232327 0%, #1a1a1e 100%);
      transform: translateY(-1px);
    }

    .mode-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #efdcae;
      background: rgba(191, 163, 93, 0.12);
      flex: 0 0 auto;
    }

    .mode-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mode-title {
      font-size: 13px;
      font-weight: 600;
      color: #eee3cc;
      line-height: 1.15;
    }

    .mode-hint {
      font-size: 11px;
      color: #b8a88e;
      line-height: 1.2;
    }

    .mode-btn:focus-visible {
      outline: 2px solid rgba(191, 163, 93, 0.85);
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <div class="popup">
    <div class="header">
      <img src="/icons/icon-48.png" alt="" class="logo">
      <div class="title-wrap">
        <div class="title">TabLab</div>
        <div class="subtitle">Choose workspace mode</div>
      </div>
    </div>

    <div class="modes">
      <button id="openPanel" class="mode-btn">
        <span class="mode-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4M9 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H9M9 3v18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="mode-copy">
          <span class="mode-title">Side Panel</span>
          <span class="mode-hint">Quick actions for current tab `Alt+S`</span>
        </span>
      </button>

      <button id="openFull" class="mode-btn">
        <span class="mode-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="mode-copy">
          <span class="mode-title">Full View</span>
          <span class="mode-hint">Complete dashboard and analytics</span>
        </span>
      </button>
    </div>
  </div>
  <script type="module" src="/src/pages/popup/index.ts"></script>
</body>
</html>
